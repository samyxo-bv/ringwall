# Ringwall AI Coding & Autonomous Agent Guard Policies
# Stops prompt-injected or runaway agents (Claude Code, Codex, Cursor, MCP tools, Python/Node scripts)
# from reading host secrets, exfiltrating credentials, or executing destructive wipe loops.
rules:
  - id: RW-AGENT-001
    name: AI agent or script accessing SSH private keys
    category: ai-agent-guard
    severity: critical
    action: freeze
    mitre: T1552.004
    description: Detects AI agent process trees or scripted runtimes reading SSH private key material.
    match:
      event_types: [open]
      path_globs:
        - '**/.ssh/id_*'
        - '**/.ssh/*.pem'
        - '**/.ssh/*.key'
      exclude_path_globs:
        - '**/.ssh/*.pub'
      exclude_comm:
        - ssh
        - ssh-agent
        - ssh-add
        - ssh-keygen
        - scp
        - sftp
        - git

  - id: RW-AGENT-002
    name: AI agent accessing cloud, Kubernetes, or GPG credentials
    category: ai-agent-guard
    severity: critical
    action: freeze
    mitre: T1552.001
    description: Blocks autonomous agents from reading AWS, GCP, Kubernetes, Docker, or GPG credential stores.
    match:
      event_types: [open]
      path_globs:
        - '**/.aws/credentials'
        - '**/.kube/config'
        - '**/.docker/config.json'
        - '**/.gnupg/private-keys-v1.d/**'
        - '**/.config/gcloud/credentials.db'
      ancestor_any:
        - claude
        - codex
        - cursor
        - openclaw
        - copilot
        - aider
        - mcp
        - agent

  - id: RW-AGENT-003
    name: Destructive filesystem wipe (rm -rf root/home)
    category: ai-agent-guard
    severity: critical
    action: kill
    mitre: T1485
    description: Halts runaway destructive commands targeting /, /etc, /usr, /var, or home directories.
    match:
      event_types: [exec]
      cmdline_regex:
        - '(^|\s)rm\s+.*(-[a-zA-Z]*r[a-zA-Z]*f|-[a-zA-Z]*f[a-zA-Z]*r|--recursive\s+--force)\s+(/(\s|$)|/\*|/etc|/usr|/var|/home|~|\$HOME)'

  - id: RW-AGENT-004
    name: Encoded payload execution by agent or interpreter
    category: ai-agent-guard
    severity: high
    action: freeze
    mitre: T1027
    description: Flags base64-decoded execution pipelines commonly used in prompt-injection payloads.
    match:
      event_types: [exec]
      cmdline_regex:
        - 'base64\s+(-d|--decode).*\|.*(sh|bash|python|perl|ruby)'
