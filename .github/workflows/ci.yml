name: CI — Build, eBPF, Tests & Live ISO QEMU Verification

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: eBPF + Go Build & Race Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27"

      - name: Install eBPF build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev linux-libc-dev

      - name: Verify Go modules (readonly, committed go.sum)
        run: go mod verify

      - name: Compile eBPF tracepoint object
        run: make bpf

      - name: Run go vet and full race test suite
        run: |
          go vet -mod=readonly ./...
          go test -count=1 -mod=readonly -race -v ./...

      - name: Build static Linux binaries with embedded eBPF
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=readonly -tags ebpf_embed -ldflags "-s -w" -o bin/ringwalld ./cmd/ringwalld
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=readonly -ldflags "-s -w" -o bin/ringwallctl ./cmd/ringwallctl

      - name: Validate built-in YAML policy packs
        run: ./bin/ringwallctl policy-check ./policies

      - name: Live root host integration test (eBPF + 0600 token + simulate + audit verify)
        run: |
          TMPDIR="$(mktemp -d)"
          sudo mkdir -p "${TMPDIR}/run" "${TMPDIR}/log"
          cat > "${TMPDIR}/ringwall.yaml" <<EOF
          mode: interactive
          policy_dirs:
            - ${PWD}/policies
          audit_log_path: ${TMPDIR}/log/audit.jsonl
          sensor:
            mode: auto
          enforcer:
            enable_signals: true
            enable_nftables: false
          ai:
            enabled: false
          api:
            listen_addr: 127.0.0.1:19443
            token_file: ${TMPDIR}/run/api.token
          EOF
          sudo ./bin/ringwalld -config "${TMPDIR}/ringwall.yaml" 2>"${TMPDIR}/daemon.log" &
          DPID=$!
          trap "cat ${TMPDIR}/daemon.log || true; sudo kill $DPID 2>/dev/null || true" EXIT
          for i in $(seq 1 20); do sudo test -f "${TMPDIR}/run/api.token" && break; sleep 0.5; done
          PERM="$(sudo stat -c '%a' "${TMPDIR}/run/api.token")"
          test "${PERM}" = "600"
          grep -qE "attached (lsm/file_open|fentry/security_file_open)" "${TMPDIR}/daemon.log"
          sudo ./bin/ringwallctl -api http://127.0.0.1:19443 -token-file "${TMPDIR}/run/api.token" status
          sudo ./bin/ringwallctl -api http://127.0.0.1:19443 -token-file "${TMPDIR}/run/api.token" scan
          sudo ./bin/ringwallctl -api http://127.0.0.1:19443 -token-file "${TMPDIR}/run/api.token" patch --dry-run
          sudo ./bin/ringwallctl -api http://127.0.0.1:19443 -token-file "${TMPDIR}/run/api.token" simulate
          sudo ./bin/ringwallctl verify-log "${TMPDIR}/log/audit.jsonl"
          ./bin/ringwallctl ab-keygen "${TMPDIR}/ab"
          ./bin/ringwallctl ab-sign "${TMPDIR}/ab.priv" v0.2.0 https://example.com/ringwall.iso ./bin/ringwallctl "${TMPDIR}/ab-manifest.json"
          ./bin/ringwallctl ab-verify "${TMPDIR}/ab.pub" "${TMPDIR}/ab-manifest.json" v0.1.0

      - name: Upload compiled Linux binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ringwall-linux-amd64
          path: |
            bin/ringwalld
            bin/ringwallctl
            internal/sensor/ringwall.bpf.o

  build-and-verify-iso:
    name: Build Immutable ISO & Live QEMU Attack E2E
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download compiled Linux binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ringwall-linux-amd64
          path: .

      - name: Ensure executable permissions
        run: chmod +x bin/ringwalld bin/ringwallctl iso/build-iso.sh iso/test-qemu.sh packaging/install.sh

      - name: Install ISO builder & QEMU verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            qemu-system-x86 \
            python3

      - name: Build hardened immutable bootable ISO
        run: sudo ./iso/build-iso.sh --out dist/ringwall-appliance-amd64.iso

      - name: Boot ISO in QEMU & verify 15 live LSM + self-healing security assertions
        run: ./iso/test-qemu.sh dist/ringwall-appliance-amd64.iso

      - name: Upload verified bootable ISO
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ringwall-appliance-amd64-iso
          path: |
            dist/ringwall-appliance-amd64.iso
            dist/ringwall-appliance-amd64.iso.sha256
          retention-days: 14
