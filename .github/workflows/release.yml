name: Release — Binaries & Verified Immutable ISO

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build, Verify in QEMU & Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"

      - name: Install toolchain, ISO builder & QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libbpf-dev linux-libc-dev \
            debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
            qemu-system-x86 python3

      - name: Verify modules, build eBPF + Go binaries & run race tests
        run: |
          go mod verify
          make bpf
          go test -mod=readonly -race ./...
          VERSION="${GITHUB_REF_NAME}" make build

      - name: Package Linux tarball
        run: |
          mkdir -p dist/pkg
          cp bin/ringwalld bin/ringwallctl dist/pkg/
          cp internal/sensor/ringwall.bpf.o dist/pkg/
          cp -r policies packaging dist/pkg/
          tar -czf "dist/ringwall-${GITHUB_REF_NAME}-linux-amd64.tar.gz" -C dist/pkg .

      - name: Build & live-verify immutable bootable ISO in QEMU
        run: |
          chmod +x iso/build-iso.sh iso/test-qemu.sh
          sudo ./iso/build-iso.sh --out "dist/ringwall-${GITHUB_REF_NAME}-appliance-amd64.iso"
          ./iso/test-qemu.sh "dist/ringwall-${GITHUB_REF_NAME}-appliance-amd64.iso"

      - name: Generate combined SHA256SUMS
        run: |
          cd dist
          sha256sum "ringwall-${GITHUB_REF_NAME}-linux-amd64.tar.gz" "ringwall-${GITHUB_REF_NAME}-appliance-amd64.iso" > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            dist/ringwall-*-linux-amd64.tar.gz
            dist/ringwall-*-appliance-amd64.iso
            dist/SHA256SUMS.txt
